services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: chair-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: chair
      POSTGRES_PASSWORD: chair_dev_password
      POSTGRES_DB: chair_db
    ports:
      - "5432:5432"
    volumes:
      - chair_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-dbs.sql:/docker-entrypoint-initdb.d/01-init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chair -d chair_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chair-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - chair_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chair_pgdata:
  chair_redisdata:
