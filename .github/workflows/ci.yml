name: chair-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: chair
          POSTGRES_PASSWORD: chair_dev_password
          POSTGRES_DB: chair_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chair -d chair_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync API dependencies
        working-directory: apps/api
        run: uv sync --dev
      - name: Lint and typecheck API
        working-directory: apps/api
        run: |
          uv run ruff check src tests
          uv run mypy src
      - name: Run API unit and integration tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://chair:chair_dev_password@localhost:5432/chair_test_db
          TEST_DATABASE_URL: postgresql+asyncpg://chair:chair_dev_password@localhost:5432/chair_test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          uv run alembic upgrade head
          uv run pytest -v

  web-and-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
